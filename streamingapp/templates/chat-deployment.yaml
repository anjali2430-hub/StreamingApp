apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
spec:
  replicas: {{ .Values.services.chat.replicas }}
  selector:
    matchLabels:
      app: chat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: {{ .Values.services.chat.image }}:{{ .Values.services.chat.tag }}
          ports:
            - containerPort: {{ .Values.services.chat.port }}
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
---
apiVersion: v1
kind: Service
metadata:
  name: chat-svc
spec:
  selector:
    app: chat
  ports:
    - port: {{ .Values.services.chat.port }}
      targetPort: {{ .Values.services.chat.port }}
