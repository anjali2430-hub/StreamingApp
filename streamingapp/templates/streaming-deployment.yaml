apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
spec:
  replicas: {{ .Values.services.streaming.replicas }}
  selector:
    matchLabels:
      app: streaming
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
        - name: streaming
          image: {{ .Values.services.streaming.image }}:{{ .Values.services.streaming.tag }}
          ports:
            - containerPort: {{ .Values.services.streaming.port }}
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-svc
spec:
  selector:
    app: streaming
  ports:
    - port: {{ .Values.services.streaming.port }}
      targetPort: {{ .Values.services.streaming.port }}
